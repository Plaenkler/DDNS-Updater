---

version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
    assignees:
      - "Plaenkler"
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*"
    # The golangci-lint bundled with Super-Linter does not support Go 1.27 yet.
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-minor"
    multi-ecosystem-group: "dependencies"
