---

version: "2"
run:
  timeout: 5m

linters:
  default: all
  disable:
    - cyclop
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funlen
    - gochecknoglobals
    - godot
    - err113
    - lll
    - nakedret
    - nestif
    - godox
    - dupl
    - goconst
    - nilerr
    - ireturn
    - nosprintfhostport
    - depguard
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
    - mnd
    - gomodguard
    - gomodguard_v2
    - gochecknoinits
    - nlreturn
    - revive
    - varnamelen
    - tagliatelle
    - tagalign
    - wsl_v5
    - wsl
    - wrapcheck
    - errorlint
    # The suggested replacements are iterators, generics and the slices package.
    - modernize
    # Response bodies are closed through log.ErrorClose, which bodyclose does not follow.
    - bodyclose
