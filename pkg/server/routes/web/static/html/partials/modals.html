{{define "logs-modal"}}
<div
    class="modal fade dark-mode"
    id="logs-modal"
    tabindex="-1"
    aria-labelledby="logs-modal-label"
    aria-hidden="true"
>
    <div
        class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl modal-fullscreen-lg-down"
    >
        <div class="modal-content bg-dark text-light">
            <div class="modal-header">
                <h5 class="modal-title" id="logs-modal-label">Logs</h5>
                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div
                class="modal-body logs-container font-monospace small"
                id="logs-container"
            ></div>
        </div>
    </div>
</div>
{{end}}
{{define "config-modal"}}
<div
    class="modal fade dark-mode"
    id="config-modal"
    tabindex="-1"
    aria-labelledby="config-modal-label"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header">
                <h5 class="modal-title text-light" id="config-modal-label">
                    Edit Configuration
                </h5>
                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal-body">
                <div
                    class="d-flex d-none justify-content-center align-items-center mb-3"
                    id="totp-qr"
                >
                    <img
                        src="data:image/png;base64,{{.TOTPQR}}"
                        alt="TOTP QR"
                        width="200"
                    />
                </div>
                <form action="/api/config/update" method="POST">
                    <div class="mb-3">
                        <label for="port-input" class="form-label text-light"
                            >Port</label
                        >
                        <input
                            type="number"
                            class="form-control"
                            id="port-input"
                            name="port"
                            min="1"
                            max="65535"
                            value="{{.Config.Port}}"
                            required
                        />
                    </div>
                    <div class="mb-3">
                        <label
                            for="interval-input"
                            class="form-label text-light"
                            >Interval (in seconds)</label
                        >
                        <input
                            type="number"
                            class="form-control"
                            id="interval-input"
                            name="interval"
                            min="10"
                            value="{{.Config.Interval}}"
                            required
                        />
                    </div>
                    <div class="mb-3">
                        <label
                            for="resolver-input"
                            class="form-label text-light"
                            >Custom resolver URL</label
                        >
                        <input
                            type="text"
                            class="form-control"
                            id="resolver-input"
                            name="resolver"
                            value="{{.Config.Resolver}}"
                        />
                    </div>
                    <div
                        class="form-check form-switch d-flex align-items-center gap-2 mb-3 ps-0"
                    >
                        <input
                            type="checkbox"
                            class="form-check-input m-0"
                            id="trustproxy-input"
                            name="trustproxy"
                            role="switch"
                            {{if .Config.TrustProxy}}checked{{end}}
                        />
                        <label for="trustproxy-input" class="form-check-label"
                            >Trust proxy headers</label
                        >
                    </div>
                    <div class="mb-3">
                        <label for="otp-input" class="form-label text-light"
                            >Turn TOTP on/off</label
                        >
                        <input
                            type="password"
                            class="form-control"
                            id="otp-input"
                            name="otp"
                            placeholder="123456"
                            minlength="6"
                            maxlength="6"
                            pattern="[0-9]+"
                            autocomplete="off"
                        />
                    </div>
                    <div
                        class="d-flex justify-content-between align-items-center"
                    >
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                        <div
                            class="form-check form-switch d-flex align-items-center gap-2 mb-0 ps-0"
                        >
                            <input
                                type="checkbox"
                                class="form-check-input m-0"
                                id="totp-qr-switch"
                                role="switch"
                            />
                            <label for="totp-qr-switch" class="form-check-label"
                                >Show TOTP</label
                            >
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}} 

{{define "add-modal"}}
<div
    class="modal fade dark-mode"
    id="add-modal"
    tabindex="-1"
    aria-labelledby="add-modal-label"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header">
                <h5 class="modal-title" id="add-modal-label">Add Job</h5>
                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <div class="form-label">Provider</div>
                    <div
                        class="row row-cols-2 row-cols-sm-3 g-2"
                        id="add-provider-tiles"
                    >
                        {{range .Providers}}
                        <div class="col">
                            <input
                                type="radio"
                                class="btn-check"
                                id="add-provider-{{.}}"
                                name="provider"
                                value="{{.}}"
                                autocomplete="off"
                            />
                            <label
                                for="add-provider-{{.}}"
                                class="btn btn-outline-light w-100"
                                >{{.}}</label
                            >
                        </div>
                        {{end}}
                    </div>
                </div>
                <form id="add-form" action="/api/job/create" method="POST">
                    <div id="add-inputs-container"></div>
                    <button
                        type="submit"
                        class="btn btn-primary"
                        data-bs-dismiss="modal"
                    >
                        Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}} 

{{define "edit-modal"}}
<div
    class="modal fade dark-mode"
    id="edit-modal"
    tabindex="-1"
    aria-labelledby="edit-modal-label"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header">
                <h5 class="modal-title" id="edit-modal-label">Edit Job</h5>
                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal-body">
                <input
                    type="hidden"
                    class="form-control"
                    id="edit-id"
                    name="id"
                    readonly
                />
                <div class="mb-3">
                    <label for="edit-provider-select" class="form-label"
                        >Provider</label
                    >
                    <select
                        class="form-select"
                        id="edit-provider-select"
                        name="provider"
                        required
                    >
                        {{range .Providers}}
                        <option value="{{.}}">{{.}}</option>
                        {{end}}
                    </select>
                </div>
                <form id="edit-form" action="/api/job/update" method="POST">
                    <div class="row">
                        <div class="col">
                            <div id="edit-inputs-container"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <button
                                type="submit"
                                class="btn btn-primary"
                                data-bs-dismiss="modal"
                            >
                                Save
                            </button>
                            <a
                                class="btn btn-danger float-end"
                                id="delete-button"
                                >Delete</a
                            >
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{{end}}
